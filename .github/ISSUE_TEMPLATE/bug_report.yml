name: Bug report
description: Report a reproducible problem in the skill or helper scripts.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include confidential source text, credentials, or personal data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent client
      options:
        - Codex
        - Claude Code
        - Claude Cowork
        - Gemini CLI
        - GitHub Copilot
        - Cursor
        - OpenCode
        - Windsurf
        - Devin
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe expected and actual behavior using sanitized sample text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command or prompt and minimal safe fixture.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste sanitized output from `npm run doctor` and relevant checks.
